<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Monster Energy</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>MONSTER<span>ENERGY</span></h1>
    <p>Painel do Administrador</p>
  </header>

  <nav class="admin-nav">
    <span id="saudacao"></span>
    <a href="index.html">Ver site</a>
    <button id="btn-logout">Sair</button>
  </nav>

  <main class="form-container">
    <form id="form-produto" class="form-card">
      <h2>Adicionar Produto</h2>

      <label for="nome">Nome</label>
      <input type="text" id="nome" required>

      <label for="sabor">Sabor</label>
      <input type="text" id="sabor">

      <label for="categoria_id">Categoria</label>
      <select id="categoria_id" required>
        <option value="1">Energy</option>
        <option value="2">Ultra</option>
        <option value="3">Juice</option>
        <option value="4">Rehab</option>
      </select>

      <label for="descricao">Descrição</label>
      <textarea id="descricao"></textarea>

      <label for="teor_cafeina">Cafeína (mg)</label>
      <input type="number" id="teor_cafeina">

      <label for="volume_ml">Volume (ml)</label>
      <input type="number" id="volume_ml">

      <label for="preco">Preço (R$)</label>
      <input type="number" step="0.01" id="preco" required>

      <p id="mensagem-erro" class="mensagem-erro"></p>
      <p id="mensagem-sucesso" class="mensagem-sucesso"></p>

      <button type="submit">Adicionar Produto</button>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
