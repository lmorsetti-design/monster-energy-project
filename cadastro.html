<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Monster Energy</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>MONSTER<span>ENERGY</span></h1>
  </header>

  <main class="form-container">
    <form id="form-cadastro" class="form-card">
      <h2>Criar conta</h2>

      <label for="nome">Nome</label>
      <input type="text" id="nome" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" required minlength="6">

      <p id="mensagem-erro" class="mensagem-erro"></p>
      <p id="mensagem-sucesso" class="mensagem-sucesso"></p>

      <button type="submit">Cadastrar</button>

      <p class="link-alternativo">
        Já tem conta? <a href="login.html">Entrar</a>
      </p>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
